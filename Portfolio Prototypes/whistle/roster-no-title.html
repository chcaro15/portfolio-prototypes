<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setting the game day roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: #fff;
    font-family: 'Figtree', system-ui, sans-serif;
    color: #243C4B; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 8px 0 24px; display: flex; flex-direction: column; gap: 48px; }

  .head { display: none; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #4D93D7; }
  .head h3 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; color: #1C1C1C; text-wrap: pretty; }
  .head p { margin: 0; font-size: 15px; line-height: 1.5; color: #6D6D6D; max-width: 560px; text-wrap: pretty; }

  .strip { display: flex; flex-direction: column; gap: 16px; }
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 16px; }
  .hint { font-size: 12px; color: #6D6D6D; }
  .count { font-size: 12px; font-weight: 600; color: #243C4B; font-variant-numeric: tabular-nums; }

  .track {
    display: flex; gap: 16px; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory; scroll-padding-left: 16px;
    padding: 0 16px 8px; margin: 0;
    scrollbar-width: thin;
  }
  .track::-webkit-scrollbar { height: 6px; }
  .track::-webkit-scrollbar-thumb { background: #CCCCCC; border-radius: 3px; }
  .track::-webkit-scrollbar-track { background: #F1F2F5; border-radius: 3px; }

  .nav { display: none; gap: 8px; }
  .nav button {
    width: 36px; height: 36px; flex: none; padding: 0;
    border: 1px solid #CCCCCC; border-radius: 2px; background: #fff;
    color: #243C4B; font: inherit; font-size: 18px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 120ms cubic-bezier(0.2,0,0,1), border-color 120ms cubic-bezier(0.2,0,0,1);
  }
  .nav button:hover { background: #F0EAE3; border-color: #B8C4CE; }
  .nav button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(77,147,215,0.25); }
  .nav button[disabled] { opacity: 0.4; cursor: default; background: #fff; border-color: #E5E5E5; }
  .bar-right { display: flex; align-items: center; gap: 14px; }

  figure { margin: 0; flex: 0 0 78%; max-width: 300px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 10px; }
  .track.single { scroll-snap-type: none; }
  .track.single figure { flex: 0 0 100%; max-width: 340px; margin: 0 auto; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { font-size: 13px; line-height: 1.45; color: #6D6D6D; text-wrap: pretty; display: flex; gap: 8px; }
  figcaption .n { flex: none; font-weight: 700; color: #4D93D7; font-variant-numeric: tabular-nums; }

  @media (min-width: 720px) {
    figure { flex: 0 0 260px; max-width: 260px; }
    .hint { display: none; }
    .nav { display: flex; }
  }
</style>
</head>
<body>
<div class="wrap">

  <section class="strip" data-strip>
    
    <div class="bar"><span class="hint">Swipe or drag the bar below →</span><div class="bar-right"><span class="count" data-count></span><div class="nav" data-nav><button type="button" data-prev aria-label="Previous screen">‹</button><button type="button" data-next aria-label="Next screen">›</button></div></div></div>
    <div class="track" data-track>
      <figure><img src="phones/05-roster-staff-and-roster.png" alt="Staff and roster list"><figcaption><span class="n">01</span><span>Staff and roster for this game</span></figcaption></figure>
      <figure><img src="phones/06-roster-select-available.png" alt="Selecting available players"><figcaption><span class="n">02</span><span>Select who is available, then save</span></figcaption></figure>
      <figure><img src="phones/07-roster-club-pass-add.png" alt="Adding a club pass player"><figcaption><span class="n">03</span><span>Add a previous club pass player or request a new one</span></figcaption></figure>
      <figure><img src="phones/08-roster-availability-counts.png" alt="Availability counts"><figcaption><span class="n">04</span><span>Availability counts, with club pass players flagged</span></figcaption></figure>
      <figure><img src="phones/09-player-card-rostered.png" alt="Player card for a rostered player"><figcaption><span class="n">05</span><span>Tapping a player’s name opens their player card</span></figcaption></figure>
      <figure><img src="phones/10-player-card-club-pass.png" alt="Player card for a club pass player"><figcaption><span class="n">06</span><span>A club pass player, number still to be assigned</span></figcaption></figure>
    </div>
  </section>

</div>
<script>
  document.querySelectorAll('[data-strip]').forEach(strip => {
    const track = strip.querySelector('[data-track]');
    const out = strip.querySelector('[data-count]');
    if (!track || !out) return;
    const figs = [...track.querySelectorAll('figure')];
    const update = () => {
      const nv = strip.querySelector('[data-nav]');
      if (track.scrollWidth <= track.clientWidth + 1) { out.hidden = true; if (nv) nv.style.display = 'none'; return; }
      out.hidden = false; if (nv) nv.style.removeProperty('display');
      const pad = parseFloat(getComputedStyle(track).scrollPaddingLeft) || 0;
      const edge = track.scrollLeft + pad;
      let best = 0, bestD = Infinity;
      figs.forEach((f, i) => {
        const d = Math.abs(f.offsetLeft - edge);
        if (d < bestD) { bestD = d; best = i; }
      });
      out.textContent = (best + 1) + ' / ' + figs.length;
      if (nav) {
        nav.querySelector('[data-prev]').disabled = track.scrollLeft <= 1;
        nav.querySelector('[data-next]').disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 1;
      }
    };
    const nav = strip.querySelector('[data-nav]');
    const step = () => {
      const g = parseFloat(getComputedStyle(track).columnGap) || 16;
      return (figs[0] ? figs[0].offsetWidth : 260) + g;
    };
    if (nav) {
      nav.querySelector('[data-prev]').addEventListener('click', () => track.scrollBy({ left: -step(), behavior: 'smooth' }));
      nav.querySelector('[data-next]').addEventListener('click', () => track.scrollBy({ left: step(), behavior: 'smooth' }));
    }
    track.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  });
</script>
</body>
</html>
